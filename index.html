<!DOCTYPE html>
<html>
    
<head>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>

<body>

    <div style="margin-bottom: 10px; font-family: sans-serif;">
        <label>Start Date: <input type="date" id="input-date1" value="2026-01-01"></label>
        <label style="margin-left: 10px;">End Date: <input type="date" id="input-date2" value="2026-01-10"></label>
        
        <span style="margin-left: 10px;">
            Color:
            <label style="margin-left: 5px;">R <select id="select-r"></select></label>
            <label style="margin-left: 5px;">G <select id="select-g"></select></label>
            <label style="margin-left: 5px;">B <select id="select-b"></select></label>
        </span>
    </div>

    <div id="map" style="height:512px; width:512px; border:1px solid grey; padding:5px"></div>

    <button id="button-left"><</button>

    <button id="button-right">></button>

    <script>
        let date1 = '2026-01-01';
        let date2 = '2026-01-10';
        let east = -60;
        let west = east + 180;

        let key = '216498c884cb06b917085a31450e5d84';
        let colorStr = '220+100+100';

        for (let i = 0; i <= 255; i++) {
            $("#select-r, #select-g, #select-b").append(`<option value="${i}">${i}</option>`);
        }

        $("#select-r").val(220);
        $("#select-g").val(100);
        $("#select-b").val(100);

        update_map(east, west, date1, date2);

        $("#input-date1, #input-date2, #select-r, #select-g, #select-b").on("change input", function() {
        
        let tempDate1 = $("#input-date1").val();
        let tempDate2 = $("#input-date2").val();

            if (tempDate1 && tempDate2) {
                let d1 = new Date(tempDate1);
                let d2 = new Date(tempDate2);
                let timeDiff = d2.getTime() - d1.getTime();
                let dayDiff = timeDiff / (1000 * 3600 * 24);

                if (dayDiff > 30) {
                    alert("Date range cannot exceed 30 days. Adjusting end date automatically.");
                    d1.setDate(d1.getDate() + 30);
                    tempDate2 = d1.toISOString().split('T')[0];
                    $("#input-date2").val(tempDate2);
                } 
                else if (dayDiff < 0) {
                    tempDate2 = tempDate1;
                    $("#input-date2").val(tempDate2);
                }
            }

            date1 = tempDate1;
            date2 = tempDate2;
            
            let r = $("#select-r").val();
            let g = $("#select-g").val();
            let b = $("#select-b").val();
            colorStr = `${r}+${g}+${b}`;
            
            update_map(east, west, date1, date2);
        });

        function update_map(east, west, date1, date2) {
            
            let src = `https://firms.modaps.eosdis.nasa.gov/mapserver/wms/fires/${key}/?REQUEST=GetMap&layers=fires_modis&COLORS=${colorStr}&TIME=${date1}/${date2}&WIDTH=512&HEIGHT=512&BBOX=${east},-90,${west},90`;

            console.log(src);
        
            $("#map").html(`<img src="${src}"></img>`)

            $("#button-left").click(function() {
                east -= 10;
                west = east + 180;
                update_map(east, west, date1, date2);
                if (east <= -180) 
                    this.disabled = true;
                if ($("#button-right").prop('disabled'))
                    $("#button-right").prop('disabled', false)
                
            })
            $("#button-right").click(function() {
                east += 10;
                west = east + 180;
                update_map(east, west, date1, date2);
                if (east >= 0) 
                    this.disabled = true;
                if ($("#button-left").prop('disabled'))
                    $("#button-left").prop('disabled', false)
            })
                

        }

    </script>
</body>
</html>
